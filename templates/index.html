<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope Premium - Live AI Voice Translator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0c11; color: #f4f4f5; padding-bottom: 50px; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .logo { font-weight: 700; font-size: 1.4rem; color: #fff; }
        .logo span { color: #f59e0b; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        .category-section { margin-bottom: 30px; }
        .movie-scroll-wrapper { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
        .movie-card { cursor: pointer; flex: 0 0 145px; width: 145px; }
        .image-wrapper { width: 100%; height: 210px; border-radius: 12px; overflow: hidden; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .movie-title { font-size: 13px; font-weight: 500; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* PLAYER MODAL */
        .player-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; justify-content: center; align-items: center; }
        .player-modal.active { display: flex; }
        .modal-content { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; justify-content: center; }
        .iframe-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .iframe-container iframe { position: absolute; top:0; left:0; width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 20px; right: 20px; z-index: 200000; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        
        /* ⚙️ CONTROLS PANEL */
        .ai-control-panel { 
            position: absolute; top: 20px; left: 20px; z-index: 200000; 
            display: flex; flex-direction: column; gap: 10px; background: rgba(28, 26, 34, 0.95); 
            padding: 12px 16px; border-radius: 16px; border: 1px solid #f59e0b;
        }
        .control-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
        .delay-input { width: 60px; padding: 4px; border-radius: 6px; border: 1px solid #27272a; background: #000; color: #fff; text-align: center; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

<nav><div class="logo">🎬 Cine<span>Scope AI</span></div></nav>

<main class="main-container">
    <div class="category-section">
        <h2 style="margin-bottom:10px;">የፊልሞች ዝርዝር</h2>
        <div class="movie-scroll-wrapper" id="movieDisplay"></div>
    </div>
</main>

<!-- Video Player Modal -->
<div class="player-modal" id="playerModal">
    <div class="modal-content">
        
        <!-- ⚙️ መቆጣጠሪያ ፓነል -->
        <div class="ai-control-panel">
            <div class="control-row">
                <span style="font-size:12px; color:#fff; font-weight:600;">የአማርኛ AI ድምፅ</span>
                <label class="switch">
                    <input type="checkbox" id="aiVoiceToggle" onchange="toggleAiVoice()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-row">
                <span style="font-size:11px; color:#aaa;">የድምፅ መዘግያ (Delay Sec):</span>
                <input type="number" id="delayInput" class="delay-input" value="2.0" step="0.5" min="0">
            </div>
        </div>

        <button class="close-btn" onclick="closePlayer()">✕ Close</button>
        <div class="iframe-container">
            <iframe id="videoIframe" src="" allowfullscreen="true"></iframe>
        </div>
    </div>
</div>

<script>
    const API_KEY = "f519e4673f7652685cfc57630b824606";
    let audioPollInterval;
    let lastAudioUrl = "";
    const audioPlayer = new Audio();
    let activeMovieId = null;

    window.onload = function() {
        fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${API_KEY}&language=en-US&page=1`)
        .then(res => res.json())
        .then(data => {
            const display = document.getElementById('movieDisplay');
            data.results.forEach(movie => {
                if(!movie.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openPlayer(movie.id);
                card.innerHTML = `
                    <div class="image-wrapper"><img src="https://image.tmdb.org/t/p/w500${movie.poster_path}"></div>
                    <div class="movie-title">${movie.title}</div>
                `;
                display.appendChild(card);
            });
        });
    };

    function openPlayer(tmdbId) {
        activeMovieId = tmdbId;
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('videoIframe');
        modal.classList.add('active');
        iframe.src = `https://vidsrc.pm/embed/movie/${tmdbId}`;
        
        document.getElementById('aiVoiceToggle').checked = false;
        clearInterval(audioPollInterval);
    }

    // 💡 በተኑ ON ሲደረግ ሰርቨሩ ድምፅ ሰምቶ መተርጎም ይጀምራል
    function toggleAiVoice() {
        const isOn = document.getElementById('aiVoiceToggle').checked;
        const delayVal = document.getElementById('delayInput').value;

        if (isOn && activeMovieId) {
            // የባክኤንድ ሰርቨሩን Live መጥራት
            fetch('/start_movie', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: activeMovieId, delay: delayVal })
            });

            // የተረጎመውን ድምፅ ከሰርቨሩ እየተቀበሉ Live ማጫወት
            audioPollInterval = setInterval(() => {
                fetch('/get_audio')
                .then(res => res.json())
                .then(data => {
                    if (data.url && data.url !== lastAudioUrl) {
                        lastAudioUrl = data.url;
                        audioPlayer.src = data.url;
                        audioPlayer.play().catch(e => console.log(e));
                    }
                });
            }, 1500);
        } else {
            clearInterval(audioPollInterval);
            audioPlayer.pause();
        }
    }

    function closePlayer() {
        document.getElementById('playerModal').classList.remove('active');
        document.getElementById('videoIframe').src = "";
        clearInterval(audioPollInterval);
        audioPlayer.pause();
    }
</script>
</body>
</html>
