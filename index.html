<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CineScope - Auto Server & Rotation Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0c11; color: #f4f4f5; padding-bottom: 50px; overflow-x: hidden; }

        /* 👑 PRO NAVIGATION BAR */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.4rem; color: #fff; letter-spacing: -0.5px; }
        .logo span { color: #f59e0b; } 
        .logo-icon { width: 26px; height: 26px; background: #f59e0b; border-radius: 6px; display: grid; place-items: center; color: #000; font-weight: bold; font-size: 14px; }
        .menu-icon { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .menu-icon div { width: 22px; height: 2.5px; background-color: white; border-radius: 2px; }

        /* 🔍 SEARCH */
        header { display: flex; flex-direction: column; align-items: center; padding: 10px 20px; }
        .search-container { width: 100%; max-width: 500px; margin-bottom: 10px; }
        .search-box { 
            width: 100%; padding: 12px 20px; border-radius: 30px; border: 1px solid #27272a; 
            background-color: #1c1a22; color: white; font-size: 14px; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: #f59e0b; }

        /* 🎬 MAIN CONTAINER */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        .category-section { margin-bottom: 30px; }
        .section-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; color: #fff; letter-spacing: -0.3px; }
        
        .movie-scroll-wrapper {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        .movie-scroll-wrapper::-webkit-scrollbar { display: none; } 

        /* 📱 CARD DESIGN */
        .movie-card { background: transparent; cursor: pointer; display: flex; flex-direction: column; flex: 0 0 145px; width: 145px; }
        .image-wrapper { width: 100%; height: 210px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.03); }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-rating { 
            position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 2px 6px; border-radius: 8px; 
            font-size: 10px; font-weight: 600; color: #f59e0b; display: flex; align-items: center; gap: 2px;
        }
        .movie-info { padding: 6px 2px 0 2px; }
        .movie-title { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
        .movie-meta { font-size: 11px; color: #71717a; }

        /* 📺 CINEMATIC VIDEO PLAYER MODAL */
        .player-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #000000; z-index: 99999; justify-content: center; align-items: center;
        }
        .player-modal.active { display: flex; }
        .modal-content { width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; position: relative; }

        .iframe-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; margin: auto 0; }
        .iframe-container iframe { position: absolute; top:0; left:0; width: 100%; height: 100%; border: none; }

        /* 🛠️ TOP CONTROLS */
        .player-controls {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 200000;
        }
        .close-btn { 
            background: rgba(239, 68, 68, 0.9); color: white; border: none;
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .server-container { display: flex; gap: 8px; }
        .server-btn {
            background: rgba(39, 39, 42, 0.8); color: #fff; border: 1px solid #27272a;
            padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .server-btn.active {
            background: #f59e0b; color: #000; font-weight: 600; border-color: #f59e0b;
        }

        .search-results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; display: none; }

        @media (min-width: 768px) {
            .movie-card { flex: 0 0 170px; width: 170px; }
            .image-wrapper { height: 250px; }
            .modal-content { width: 85%; height: auto; max-width: 950px; border-radius: 16px; border: 1px solid #27272a; overflow: hidden; }
            .iframe-container { padding-top: 56.25%; margin: 0; }
            .search-results-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">
        <div class="logo-icon">🎬</div> Cine<span>Scope</span>
    </div>
    <div class="menu-icon">
        <div></div>
        <div></div>
        <div></div>
    </div>
</nav>

<header>
    <div class="search-container">
        <input type="text" id="searchQuery" class="search-box" placeholder="Search movies..." onkeyup="if(event.key === 'Enter') startSearch()">
    </div>
</header>

<main class="main-container" id="mainContent">
    <div id="searchSection" style="display: none; margin-bottom: 30px;">
        <h2 class="section-title" id="searchTitle">Search Results</h2>
        <div class="search-results-grid" id="searchResultsDisplay"></div>
    </div>

    <div class="category-section">
        <h2 class="section-title">Now Playing in Theaters</h2>
        <div class="movie-scroll-wrapper" id="nowPlayingDisplay"></div>
    </div>

    <div class="category-section">
        <h2 class="section-title">⚡ Action Thrillers</h2>
        <div class="movie-scroll-wrapper" id="actionDisplay"></div>
    </div>

    <div class="category-section">
        <h2 class="section-title">🧸 Family & Animation</h2>
        <div class="movie-scroll-wrapper" id="animationDisplay"></div>
    </div>

    <div class="category-section">
        <h2 class="section-title">👻 Horror & Mystery</h2>
        <div class="movie-scroll-wrapper" id="horrorDisplay"></div>
    </div>
</main>

<div class="player-modal" id="playerModal">
    <div class="modal-content">
        <div class="player-controls">
            <button class="close-btn" onclick="closePlayer()">✕ Close</button>
            <div class="server-container">
                <button id="srv1" class="server-btn active" onclick="switchServer(1)">Server 1</button>
                <button id="srv2" class="server-btn" onclick="switchServer(2)">Server 2</button>
            </div>
        </div>
        <div class="iframe-container">
            <!-- onerror በመጠቀም ሰርቨር 1 ካልሰራ በራሱ ወደ ሰርቨር 2 እንዲቀይር ተደርጓል -->
            <iframe id="videoIframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen" onerror="autoSwitchServer()"></iframe>
        </div>
    </div>
</div>

<script>
    const API_KEY = "f519e4673f7652685cfc57630b824606";
    let currentMovieId = null;
    let currentServer = 1;

    // ማስታወቂያዎች አዲስ ታብ እንዳይከፍቱ በከፊል ይከለክላል
    window.open = function() { return null; };

    window.onload = function() {
        loadCategory(`https://api.themoviedb.org/3/movie/now_playing?api_key=${API_KEY}&language=en-US&page=1`, "nowPlayingDisplay");
        loadCategory(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=28&language=en-US`, "actionDisplay");
        loadCategory(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=en-US`, "animationDisplay");
        loadCategory(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=27&language=en-US`, "horrorDisplay");
    };

    function loadCategory(url, targetId) {
        fetch(url).then(res => res.json()).then(data => {
            const movies = data.results;
            const display = document.getElementById(targetId);
            display.innerHTML = ""; 

            movies.forEach(movie => {
                if(!movie.poster_path) return; 
                const poster = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.id); 
                card.innerHTML = `
                    <div class="image-wrapper">
                        <span class="card-rating">★ ${movie.vote_average.toFixed(1)}</span>
                        <img src="${poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">${movie.release_date ? movie.release_date.substring(0,4) : "N/A"} • Movie</div>
                    </div>
                `;
                display.appendChild(card);
            });
        });
    }

    function startSearch() {
        const query = document.getElementById('searchQuery').value;
        const searchSection = document.getElementById('searchSection');
        if(query.trim() !== "") {
            document.getElementById('searchTitle').innerText = `Results for "${query}"`;
            searchSection.style.display = "block";
            document.getElementById('searchResultsDisplay').style.display = "grid";
            loadCategory(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=en-US`, "searchResultsDisplay");
            searchSection.scrollIntoView({ behavior: 'smooth' });
        } else {
            searchSection.style.display = "none";
        }
    }

    function playMovie(tmdbId) {
        currentMovieId = tmdbId;
        document.getElementById('playerModal').classList.add('active');
        
        // 🔄 SCREEN ROTATION SYSTEM (ወደ ጎን እንዲዞር ማድረግ)
        if (document.documentElement.requestFullscreen) {
            document.getElementById('playerModal').requestFullscreen().then(() => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(error) {
                        console.log("Orientation lock ignored.");
                    });
                }
            });
        }
        
        switchServer(1); 
    }

    function switchServer(serverNum) {
        currentServer = serverNum;
        const iframe = document.getElementById('videoIframe');
        const btn1 = document.getElementById('srv1');
        const btn2 = document.getElementById('srv2');

        if (serverNum === 1) {
            btn1.classList.add('active');
            btn2.classList.remove('active');
            iframe.src = `https://vidsrc.me/embed/movie?tmdb=${currentMovieId}`; 
        } else {
            btn2.classList.add('active');
            btn1.classList.remove('active');
            iframe.src = `https://embed.su/embed/movie/${currentMovieId}`; 
        }
    }

    // 🤖 AUTO SWITCHER (ሰርቨር 1 ካልሰራ በራሱ ወደ ሰርቨር 2 ይቀይራል)
    function autoSwitchServer() {
        if (currentServer === 1) {
            console.log("Server 1 failed. Auto switching to Server 2...");
            switchServer(2);
        }
    }

    function closePlayer() {
        document.getElementById('videoIframe').src = ""; 
        document.getElementById('playerModal').classList.remove('active');
        
        // 🔄 SCREEN ROTATION RESET (ፊልሙ ሲዘጋ ወደ ነበረበት መመለስ)
        if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }
    }
</script>
</body>
</html>
