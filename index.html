<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope - Stream Movies & TV Shows</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0c11; color: #f4f4f5; padding-bottom: 50px; overflow-x: hidden; }

        /* 👑 PRO NAVIGATION BAR */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; max-width: 1200px; margin: 0 auto;
        }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.5rem; color: #fff; }
        .logo span { color: #f59e0b; } /* የወርቅ ከለር */
        .logo-icon { width: 28px; height: 28px; background: #f59e0b; border-radius: 6px; display: grid; place-items: center; color: #000; font-weight: bold; }
        
        .menu-icon { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
        .menu-icon div { width: 25px; height: 3px; background-color: white; border-radius: 2px; }

        /* 🔍 SEARCH & HERO AREA */
        header { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .search-container { width: 100%; max-width: 500px; margin-bottom: 30px; }
        .search-box { 
            width: 100%; padding: 14px 25px; border-radius: 30px; border: 1px solid #27272a; 
            background-color: #1c1a22; color: white; font-size: 15px; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }

        /* 🏷️ GENRE TAGS (ልክ እንደ ፎቶው) */
        .genres-container { 
            display: flex; gap: 12px; max-width: 1200px; margin: 0 auto 40px auto; 
            padding: 0 20px; overflow-x: auto; scrollbar-width: none;
        }
        .genres-container::-webkit-scrollbar { display: none; }
        .genre-btn { 
            background: #1c1a22; color: #e4e4e7; border: 1px solid #27272a; 
            padding: 10px 22px; border-radius: 25px; font-size: 14px; font-weight: 500; 
            cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .genre-btn:hover, .genre-btn.active { background: #2e2a38; border-color: #f59e0b; color: #fff; }

        /* 🎬 MOVIE GRID SECTION */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .section-title { font-size: 1.6rem; font-weight: 600; margin-bottom: 25px; color: #fff; letter-spacing: -0.5px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 25px; }

        /* 📱 PROFESSIONAL MOVIE CARD */
        .movie-card { background: transparent; cursor: pointer; position: relative; }
        .image-wrapper { width: 100%; height: 250px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .movie-card:hover img { transform: scale(1.06); }
        
        .card-rating { 
            position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 12px; 
            font-size: 12px; font-weight: 600; color: #f59e0b; display: flex; align-items: center; gap: 4px;
        }

        .movie-info { padding: 12px 4px 0 4px; }
        .movie-title { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .movie-meta { font-size: 13px; color: #71717a; }

        /* 📺 CINEMATIC MODAL PLAYER */
        .player-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5, 5, 8, 0.95); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(20px);
        }
        .player-modal.active { display: flex; }
        .modal-content { width: 95%; max-width: 950px; background: #131217; border-radius: 20px; overflow: hidden; border: 1px solid #27272a; }
        .iframe-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        
        /* ⚙️ FULL FEATURES ENABLED: Speed, Quality, Rotation and Fullscreen features active */
        .iframe-container iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        .server-control { display: flex; padding: 15px 20px; background: #131217; justify-content: flex-end; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 10px 24px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

<!-- Navigation -->
<nav>
    <div class="logo">
        <div class="logo-icon">🎬</div> Cine<span>Scope</span>
    </div>
    <div class="menu-icon">
        <div></div>
        <div></div>
        <div></div>
    </div>
</nav>

<header>
    <div class="search-container">
        <input type="text" id="searchQuery" class="search-box" placeholder="Search movies..." onkeyup="if(event.key === 'Enter') startSearch()">
    </div>
</header>

<!-- Genre Filters -->
<div class="genres-container">
    <button class="genre-btn active" onclick="filterGenre('all')">All</button>
    <button class="genre-btn" onclick="filterGenre('28')">Action</button>
    <button class="genre-btn" onclick="filterGenre('12')">Adventure</button>
    <button class="genre-btn" onclick="filterGenre('16')">Animation</button>
    <button class="genre-btn" onclick="filterGenre('35')">Comedy</button>
    <button class="genre-btn" onclick="filterGenre('80')">Crime</button>
    <button class="genre-btn" onclick="filterGenre('27')">Horror</button>
</div>

<main class="main-container">
    <h2 class="section-title" id="listTitle">Now Playing in Theaters</h2>
    <div class="movie-grid" id="movieDisplay"></div>
</main>

<!-- Video Player Modal -->
<div class="player-modal" id="playerModal">
    <div class="modal-content">
        <div class="iframe-container">
            <!-- ⚡ ALLOWED EVERYTHING: Gives the player capability for rotation, speed and quality switching natively -->
            <iframe id="videoIframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture; screen-wake-lock"></iframe>
        </div>
        <div class="server-control">
            <button class="close-btn" onclick="closePlayer()">Close</button>
        </div>
    </div>
</div>

<script>
    const API_KEY = "f519e4673f7652685cfc57630b824606";
    let activeGenre = 'all';

    window.open = function() { return null; };

    window.onload = function() {
        loadMovies();
    };

    function loadMovies() {
        const url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${API_KEY}&language=en-US&page=1`;
        fetchMovies(url, "Now Playing in Theaters");
    }

    function filterGenre(genreId) {
        document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        if(genreId === 'all') {
            loadMovies();
        } else {
            const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${genreId}&language=en-US`;
            fetchMovies(url, "Filtered Movies");
        }
    }

    function startSearch() {
        const query = document.getElementById('searchQuery').value;
        if(query.trim() !== "") {
            fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=en-US`, `Results for "${query}"`);
        }
    }

    function fetchMovies(url, titleText) {
        document.getElementById('listTitle').innerText = titleText;
        fetch(url)
        .then(res => res.json())
        .then(data => {
            const movies = data.results;
            const display = document.getElementById('movieDisplay');
            display.innerHTML = ""; 

            movies.forEach(movie => {
                if(!movie.poster_path) return; 
                
                const poster = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                const year = movie.release_date ? movie.release_date.substring(0,4) : "N/A";
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : "0.0";

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.id); 
                card.innerHTML = `
                    <div class="image-wrapper">
                        <span class="card-rating">★ ${rating}</span>
                        <img src="${poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">${year} • Cinema Movie</div>
                    </div>
                `;
                display.appendChild(card);
            });
        });
    }

    // ⚡ AUTO SERVER PLAY INITIATOR
    function playMovie(tmdbId) {
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('videoIframe');
        
        modal.classList.add('active');
        // Auto loads your working Server 2 setup right away!
        iframe.src = `https://vidsrc.pm/embed/movie/${tmdbId}`; 
    }

    function closePlayer() {
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('videoIframe');
        iframe.src = ""; 
        modal.classList.remove('active');
    }
</script>
</body>
</html>
