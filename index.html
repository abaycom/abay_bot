<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>🎬 Nilo Cinema</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #252540;
            --accent: #e50914;
            --accent-hover: #ff1a25;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --text-muted: #6b6b7b;
            --border: #2a2a3e;
            --gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loader {
            width: 60px; height: 60px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
        }
        .logo i { font-size: 24px; }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .invite-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s;
        }
        .invite-btn:hover { transform: translateY(-1px); }

        .search-container { position: relative; }
        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 40px 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted); cursor: pointer;
        }
        .search-clear {
            position: absolute; right: 36px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted); cursor: pointer; display: none; font-size: 14px;
        }
        .search-clear.visible { display: block; }

        .categories {
            display: flex; gap: 8px; padding: 12px 16px;
            overflow-x: auto; scrollbar-width: none; margin-top: 90px;
        }
        .categories::-webkit-scrollbar { display: none; }
        .category-btn {
            flex-shrink: 0; padding: 8px 18px; border-radius: 20px;
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-secondary); font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.3s; white-space: nowrap; font-family: 'Inter', sans-serif;
        }
        .category-btn:hover, .category-btn.active {
            background: var(--accent); color: white; border-color: var(--accent);
        }

        .section-title {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; margin: 20px 0 12px;
        }
        .section-title h2 { font-size: 18px; font-weight: 700; }
        .section-title a { color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 500; cursor: pointer; }

        .movie-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; padding: 0 16px;
        }
        .movie-card {
            background: var(--bg-card); border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; position: relative;
        }
        .movie-card:hover {
            transform: translateY(-4px); box-shadow: 0 8px 24px rgba(229, 9, 20, 0.2);
        }
        .movie-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .movie-info { padding: 10px; }
        .movie-title {
            font-size: 13px; font-weight: 600; line-height: 1.3;
            overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .movie-meta {
            display: flex; align-items: center; gap: 6px; margin-top: 6px;
            font-size: 11px; color: var(--text-muted);
        }
        .rating { display: flex; align-items: center; gap: 3px; color: var(--gold); font-weight: 600; }
        .new-badge {
            position: absolute; top: 8px; left: 8px; background: var(--accent);
            color: white; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
        }
        .top-badge {
            position: absolute; top: 8px; right: 8px; background: var(--gold);
            color: #000; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
        }
        .card-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .share-card-btn, .fav-btn { cursor: pointer; transition: transform 0.2s; color: var(--text-secondary); }
        .share-card-btn:hover, .fav-btn:hover { transform: scale(1.2); color: var(--accent); }

        .details-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 15, 0.98); z-index: 1000;
            display: none; flex-direction: column; overflow-y: auto; padding-bottom: 40px;
        }
        .details-modal.active { display: flex; }
        .details-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; background: rgba(18, 18, 26, 0.95);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border);
        }
        .details-title { font-size: 16px; font-weight: 700; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .details-body { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .details-banner {
            width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; margin-bottom: 16px;
        }
        .details-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; }
        
        .season-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .season-tab {
            padding: 8px 16px; border-radius: 8px; background: var(--bg-card);
            border: 1px solid var(--border); color: var(--text-secondary);
            font-size: 13px; cursor: pointer; white-space: nowrap; font-family: 'Inter', sans-serif; transition: all 0.3s;
        }
        .season-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .episode-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .episode-btn {
            padding: 12px 8px; border-radius: 8px; background: var(--bg-card);
            border: 1px solid var(--border); color: var(--text-secondary);
            font-size: 13px; cursor: pointer; text-align: center; font-family: 'Inter', sans-serif; transition: all 0.3s; font-weight: 600;
        }
        .episode-btn:hover, .episode-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .player-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; z-index: 1100; display: none; flex-direction: column;
        }
        .player-modal.active { display: flex; }
        .player-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: rgba(0,0,0,0.9); z-index: 10; flex-wrap: wrap; gap: 8px;
        }
        .player-controls-top { display: flex; gap: 10px; align-items: center; }
        .server-selector {
            background: var(--bg-card); border: 1px solid var(--border); color: white;
            padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; outline: none; font-family: 'Inter', sans-serif;
        }
        .player-btn {
            background: rgba(255,255,255,0.15); border: none; color: white;
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .video-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: #000; }
        .video-wrapper { width: 100%; height: 100%; position: relative; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(18, 18, 26, 0.98); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 6px 16px; color: var(--text-muted); text-decoration: none; font-size: 11px; cursor: pointer; transition: color 0.3s; font-weight: 500;
        }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--accent); }

        .invite-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .invite-modal.active { display: flex; }
        .invite-box {
            background: var(--bg-secondary); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; text-align: center; border: 1px solid var(--border);
        }
        .invite-box h3 { font-size: 20px; margin-bottom: 8px; font-weight: 700; }
        .invite-box p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
        .invite-link-box {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
        }
        .invite-link-box input { flex: 1; background: none; border: none; color: var(--text-primary); font-size: 13px; outline: none; font-family: 'Inter', sans-serif; }
        .copy-btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .share-btn { width: 100%; background: #0088cc; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .close-invite { margin-top: 12px; background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; font-weight: 500; }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); color: var(--text-primary); padding: 12px 24px; border-radius: 10px;
            font-size: 14px; z-index: 400; opacity: 0; transition: all 0.3s; border: 1px solid var(--border); font-weight: 500;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .content { padding-bottom: 80px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; }

        .hero-banner {
            margin: 0 16px 16px; border-radius: 16px; overflow: hidden; height: 150px;
            background: linear-gradient(135deg, #1a1a2e, #2a1a3e); display: flex; align-items: center; justify-content: center;
        }
        .hero-content { text-align: center; padding: 20px; }
        .hero-content h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--accent); }
        .hero-content p { color: var(--text-secondary); font-size: 14px; }

        @media (min-width: 768px) {
            .movie-grid { grid-template-columns: repeat(3, 1fr); }
            .episode-grid { grid-template-columns: repeat(8, 1fr); }
        }
        @media (min-width: 1024px) {
            .movie-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
        <div class="loading-text">Loading Nilo Cinema...</div>
    </div>

    <header class="header">
        <div class="header-top">
            <div class="logo">
                <i class="fas fa-film"></i>
                <span>Nilo Cinema</span>
            </div>
            <div class="header-actions">
                <button class="invite-btn" onclick="showInvite()">
                    <i class="fas fa-user-plus"></i> Invite
                </button>
            </div>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search movies or TV shows..." autocomplete="off">
            <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
            <i class="fas fa-search search-icon" onclick="doSearch()"></i>
        </div>
    </header>

    <div class="categories" id="categories">
        <button class="category-btn active" data-category="all">All</button>
        <button class="category-btn" data-category="tv_shows">Tv Show</button>
        <button class="category-btn" data-category="horror">Horror</button>
        <button class="category-btn" data-category="action">Action</button>
        <button class="category-btn" data-category="animation">Animation</button>
        <button class="category-btn" data-category="new">New</button>
        <button class="category-btn" data-category="top">Top Move</button>
        <button class="category-btn" data-category="romantic">Romantic</button>
        <button class="category-btn" data-category="series">Series</button>
    </div>

    <div class="hero-banner" id="heroBanner">
        <div class="hero-content">
            <h1>🎬 Nilo Cinema</h1>
            <p>Watch High Quality Movies & Series for Free</p>
        </div>
    </div>

    <div class="content" id="mainContent"></div>

    <div class="details-modal" id="detailsModal">
        <div class="details-header">
            <div class="details-title" id="detailsTitle">Series Title</div>
            <button class="player-btn" onclick="closeDetailsModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="details-body">
            <img class="details-banner" id="detailsBanner" src="" alt="Banner">
            <p class="details-desc" id="detailsDesc">Description...</p>
            <h4 style="margin-bottom: 12px; font-size:15px;"><i class="fas fa-list-ul"></i> Select Season & Episode</h4>
            <div class="season-tabs" id="seasonTabs"></div>
            <div class="episode-grid" id="episodeGrid"></div>
        </div>
    </div>

    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <div class="player-title" id="playerTitle" style="font-size:13px;font-weight:600;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Movie Title</div>
            
            <!-- Server Selector Dropdown to fix black screen errors -->
            <select class="server-selector" id="serverSelector" onchange="changeServer()">
                <option value="vidsrc_cc">Server 1 (VidSrc.cc)</option>
                <option value="vidsrc_su">Server 2 (VidSrc.su)</option>
                <option value="vidembed">Server 3 (VidEmbed)</option>
                <option value="multiembed">Server 4 (MultiEmbed)</option>
            </select>

            <div class="player-controls-top">
                <button class="player-btn" onclick="toggleFullscreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
                <button class="player-btn" onclick="toggleRotation()" title="Rotate"><i class="fas fa-mobile-alt"></i></button>
                <button class="player-btn" onclick="closePlayer()"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="video-container" id="videoContainer">
            <div class="video-wrapper" id="videoWrapper">
                <iframe id="videoFrame" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" loading="eager"></iframe>
            </div>
        </div>
    </div>

    <div class="invite-modal" id="inviteModal">
        <div class="invite-box">
            <i class="fas fa-gift" style="font-size:40px;color:var(--accent);margin-bottom:12px;"></i>
            <h3>Invite Friends</h3>
            <p>Invite your friends and earn rewards!</p>
            <div class="invite-link-box">
                <input type="text" id="inviteLink" readonly>
                <button class="copy-btn" onclick="copyInvite()">Copy</button>
            </div>
            <button class="share-btn" onclick="shareInvite()"><i class="fab fa-telegram"></i> Share on Telegram</button>
            <button class="close-invite" onclick="hideInvite()">Close</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nav-item" onclick="switchTab('movies')"><i class="fas fa-film"></i><span>Movies</span></div>
        <div class="nav-item" onclick="switchTab('series')"><i class="fas fa-tv"></i><span>Series</span></div>
        <div class="nav-item" onclick="switchTab('favorites')"><i class="fas fa-heart"></i><span>My List</span></div>
    </nav>

    <script>
        const CONFIG = {
            TMDB_API_KEY: 'f519e4673f7652685cfc57630b824606',
            TMDB_BASE_URL: 'https://api.themoviedb.org/3',
            IMAGE_BASE_URL: 'https://image.tmdb.org/t/p/w500'
        };

        let currentMedia = { id: null, type: 'movie', season: 1, episode: 1 };

        let state = {
            currentCategory: 'all',
            currentTab: 'home',
            movies: [],
            tvShows: [],
            searchResults: [],
            favorites: JSON.parse(localStorage.getItem('nilo_favorites') || '[]'),
            userData: null,
            isRotated: false,
            registeredUsers: JSON.parse(localStorage.getItem('nilo_registeredUsers') || '[]'),
            totalPlays: parseInt(localStorage.getItem('nilo_totalPlays') || '0')
        };

        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0a0a0f');
        tg.setBackgroundColor('#0a0a0f');

        function initUser() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                state.userData = tg.initDataUnsafe.user;
                const userInfo = {
                    id: state.userData.id,
                    first_name: state.userData.first_name,
                    username: state.userData.username || '',
                    joined: new Date().toISOString(),
                    lastActive: new Date().toISOString()
                };
                const existingIndex = state.registeredUsers.findIndex(u => u.id === userInfo.id);
                if (existingIndex === -1) {
                    state.registeredUsers.push(userInfo);
                } else {
                    state.registeredUsers[existingIndex].lastActive = new Date().toISOString();
                }
                localStorage.setItem('nilo_registeredUsers', JSON.stringify(state.registeredUsers));
            }
        }

        async function fetchFromTMDB(endpoint) {
            try {
                const response = await fetch(`${CONFIG.TMDB_BASE_URL}${endpoint}&api_key=${CONFIG.TMDB_API_KEY}`);
                if (!response.ok) throw new Error('API Error');
                return await response.json();
            } catch (error) {
                console.error('TMDB Error:', error);
                return null;
            }
        }

        async function loadMovies() {
            const endpoints = {
                new: ['/movie/now_playing?language=en-US&page=1'],
                top: ['/movie/top_rated?language=en-US&page=1'],
                horror: ['/discover/movie?with_genres=27&language=en-US&page=1'],
                action: ['/discover/movie?with_genres=28&language=en-US&page=1'],
                animation: ['/discover/movie?with_genres=16&language=en-US&page=1'],
                romantic: ['/discover/movie?with_genres=10749&language=en-US&page=1']
            };

            for (const [category, urls] of Object.entries(endpoints)) {
                for (const endpoint of urls) {
                    const data = await fetchFromTMDB(endpoint);
                    if (data && data.results) {
                        data.results.forEach(movie => {
                            const existing = state.movies.find(m => m.id === movie.id);
                            if (existing) {
                                if (!existing.categories) existing.categories = [];
                                if (!existing.categories.includes(category)) existing.categories.push(category);
                            } else {
                                state.movies.push({ ...movie, categories: [category] });
                            }
                        });
                    }
                }
            }

            const tvData = await fetchFromTMDB('/tv/popular?language=en-US&page=1');
            if (tvData && tvData.results) {
                state.tvShows = tvData.results.map(t => ({ ...t, categories: ['series', 'tv_shows'], isTV: true }));
            }

            renderContent();
            document.getElementById('loadingScreen').classList.add('hidden');
        }

        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            searchClear.classList.toggle('visible', query.length > 0);
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (query.length >= 2) doSearch(query);
                else if (query.length === 0) { state.searchResults = []; renderContent(); }
            }, 400);
        });

        async function doSearch(query) {
            if (!query || query.length < 2) return;
            const data = await fetchFromTMDB(`/search/multi?query=${encodeURIComponent(query)}&language=en-US`);
            if (data && data.results) {
                state.searchResults = data.results.filter(r => (r.media_type === 'movie' || r.media_type === 'tv') && r.poster_path);
                renderContent();
            }
        }

        function clearSearch() {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            state.searchResults = [];
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('mainContent');

            if (state.searchResults.length > 0) {
                container.innerHTML = `
                    <div class="section-title">
                        <h2>🔍 Search Results (${state.searchResults.length})</h2>
                        <a onclick="clearSearch()">Clear</a>
                    </div>
                    <div class="movie-grid" id="searchGrid"></div>
                `;
                renderMovieGrid('searchGrid', state.searchResults);
                return;
            }

            if (state.currentTab === 'home') {
                container.innerHTML = `
                    <div class="section-title"><h2>📺 TV Shows</h2><a onclick="switchTabFromLink('series')">See All</a></div>
                    <div class="movie-grid" id="homeTvShows"></div>
                    <div class="section-title"><h2>👻 Horror Movies</h2></div>
                    <div class="movie-grid" id="homeHorror"></div>
                    <div class="section-title"><h2>🔥 Action Movies</h2></div>
                    <div class="movie-grid" id="homeAction"></div>
                    <div class="section-title"><h2>🎨 Animation</h2></div>
                    <div class="movie-grid" id="homeAnimation"></div>
                    <div class="section-title"><h2>✨ New Releases</h2></div>
                    <div class="movie-grid" id="homeNew"></div>
                    <div class="section-title"><h2>⭐ Top Movies</h2></div>
                    <div class="movie-grid" id="homeTop"></div>
                    <div class="section-title"><h2>💖 Romantic</h2></div>
                    <div class="movie-grid" id="homeRomantic"></div>
                `;
                renderMovieGrid('homeTvShows', state.tvShows.slice(0, 4));
                renderMovieGrid('homeHorror', state.movies.filter(m => m.categories?.includes('horror')).slice(0, 4));
                renderMovieGrid('homeAction', state.movies.filter(m => m.categories?.includes('action')).slice(0, 4));
                renderMovieGrid('homeAnimation', state.movies.filter(m => m.categories?.includes('animation')).slice(0, 4));
                renderMovieGrid('homeNew', state.movies.filter(m => m.categories?.includes('new')).slice(0, 4));
                renderMovieGrid('homeTop', state.movies.filter(m => m.categories?.includes('top')).slice(0, 4));
                renderMovieGrid('homeRomantic', state.movies.filter(m => m.categories?.includes('romantic')).slice(0, 4));
            } else if (state.currentTab === 'movies') {
                let filtered = state.movies;
                if (state.currentCategory !== 'all') {
                    filtered = state.movies.filter(m => m.categories && m.categories.includes(state.currentCategory));
                }
                container.innerHTML = `<div class="movie-grid" id="movieGrid"></div>`;
                renderMovieGrid('movieGrid', filtered);
            } else if (state.currentTab === 'series') {
                container.innerHTML = `<div class="movie-grid" id="seriesGrid"></div>`;
                renderMovieGrid('seriesGrid', state.tvShows);
            } else if (state.currentTab === 'favorites') {
                if (state.favorites.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-heart-broken"></i>
                            <h3>No Favorites Yet</h3>
                            <p>Tap the heart icon on any movie to save it</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="movie-grid" id="favGrid"></div>`;
                    renderMovieGrid('favGrid', state.favorites);
                }
            }
        }

        function renderMovieGrid(gridId, items) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            if (items.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-film"></i><h3>No content found</h3></div>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                const poster = item.poster_path ? CONFIG.IMAGE_BASE_URL + item.poster_path : 'https://via.placeholder.com/300x450/1a1a2e/ffffff?text=No+Image';
                const title = item.title || item.name || 'Unknown';
                const year = (item.release_date || item.first_air_date || '').substring(0, 4);
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const isFav = state.favorites.some(f => f.id === item.id);
                const isNew = item.categories && item.categories.includes('new');
                const isTop = item.categories && item.categories.includes('top');
                const mediaType = item.isTV || item.name ? 'tv' : 'movie';

                return `
                    <div class="movie-card" onclick="handleMediaClick(${item.id}, '${mediaType}')">
                        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                        ${isTop ? '<span class="top-badge">TOP</span>' : ''}
                        <img class="movie-poster" src="${poster}" alt="${title}" loading="lazy">
                        <div class="movie-info">
                            <div class="movie-title">${title}</div>
                            <div class="movie-meta">
                                <span class="rating"><i class="fas fa-star"></i> ${rating}</span>
                                <span>${year}</span>
                                <div class="card-actions">
                                    <span class="share-card-btn" onclick="event.stopPropagation();shareMedia(${item.id}, '${title}')" title="Share">
                                        <i class="fas fa-share-alt"></i>
                                    </span>
                                    <span class="fav-btn" onclick="event.stopPropagation();toggleFavorite(${item.id})">
                                        <i class="${isFav ? 'fas' : 'far'} fa-heart" style="color:${isFav ? '#e50914' : ''}"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                state.currentCategory = this.dataset.category;
                state.searchResults = [];
                searchInput.value = '';
                searchClear.classList.remove('visible');

                if (this.dataset.category === 'series' || this.dataset.category === 'tv_shows') {
                    switchTabFromLink('series');
                } else {
                    if (state.currentTab !== 'movies') {
                        state.currentTab = 'movies';
                        updateNavActive();
                    }
                    renderContent();
                }
            });
        });

        function updateNavActive() {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const navItems = document.querySelectorAll('.nav-item');
            if (state.currentTab === 'home') navItems[0].classList.add('active');
            else if (state.currentTab === 'movies') navItems[1].classList.add('active');
            else if (state.currentTab === 'series') navItems[2].classList.add('active');
            else if (state.currentTab === 'favorites') navItems[3].classList.add('active');
        }

        function switchTabFromLink(tab) {
            state.currentTab = tab;
            updateNavActive();
            renderContent();
            window.scrollTo(0, 0);
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderContent();
            window.scrollTo(0, 0);
        }

        async function handleMediaClick(id, type) {
            const details = await fetchFromTMDB(`/${type}/${id}?language=en-US`);
            if (!details) return;

            if (type === 'tv') {
                showSeriesDetails(details);
            } else {
                playMovie(id, details.title);
            }
        }

        async function showSeriesDetails(details) {
            const modal = document.getElementById('detailsModal');
            document.getElementById('detailsTitle').textContent = details.name;
            document.getElementById('detailsDesc').textContent = details.overview || 'No description available.';
            document.getElementById('detailsBanner').src = details.backdrop_path ? CONFIG.IMAGE_BASE_URL + details.backdrop_path : (details.poster_path ? CONFIG.IMAGE_BASE_URL + details.poster_path : '');

            const seasonTabs = document.getElementById('seasonTabs');
            const episodeGrid = document.getElementById('episodeGrid');

            const seasons = (details.seasons || []).filter(s => s.season_number > 0);
            if (seasons.length === 0) {
                seasonTabs.innerHTML = '<p>No seasons found</p>';
                episodeGrid.innerHTML = '';
                modal.classList.add('active');
                return;
            }

            seasonTabs.innerHTML = seasons.map((s, i) => `
                <button class="season-tab ${i === 0 ? 'active' : ''}" onclick="loadSeasonEpisodes(${details.id}, ${s.season_number}, this)">
                    Season ${s.season_number}
                </button>
            `).join('');

            loadSeasonEpisodes(details.id, seasons[0].season_number);
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        async function loadSeasonEpisodes(tvId, seasonNum, tabEl) {
            if (tabEl) {
                document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
                tabEl.classList.add('active');
            }

            const episodeGrid = document.getElementById('episodeGrid');
            episodeGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">Loading episodes...</p>';

            const seasonData = await fetchFromTMDB(`/tv/${tvId}/season/${seasonNum}?language=en-US`);
            if (seasonData && seasonData.episodes) {
                episodeGrid.innerHTML = seasonData.episodes.map(e => `
                    <button class="episode-btn" onclick="playEpisode(${tvId}, ${e.season_number}, ${e.episode_number})">
                        ${e.episode_number}
                    </button>
                `).join('');
            } else {
                episodeGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">No episodes found</p>';
            }
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function playMovie(id, title) {
            currentMedia = { id: id, type: 'movie', season: 1, episode: 1, title: title };
            loadPlayerUrl();
        }

        function playEpisode(tvId, season, episode) {
            closeDetailsModal();
            currentMedia = { id: tvId, type: 'tv', season: season, episode: episode, title: `Season ${season} Episode ${episode}` };
            loadPlayerUrl();
        }

        function loadPlayerUrl() {
            const serverKey = document.getElementById('serverSelector').value;
            let url = '';

            if (currentMedia.type === 'movie') {
                if (serverKey === 'vidsrc_cc') url = `https://vidsrc.cc/v2/embed/movie/${currentMedia.id}`;
                else if (serverKey === 'vidsrc_su') url = `https://vidsrc-embed.su/embed/movie/${currentMedia.id}`;
                else if (serverKey === 'vidembed') url = `https://vidembed.cc/embed.php?tmdb=1&id=${currentMedia.id}`;
                else if (serverKey === 'multiembed') url = `https://multiembed.mov/?video_id=${currentMedia.id}&tmdb=1`;
            } else {
                if (serverKey === 'vidsrc_cc') url = `https://vidsrc.cc/v2/embed/tv/${currentMedia.id}/${currentMedia.season}/${currentMedia.episode}`;
                else if (serverKey === 'vidsrc_su') url = `https://vidsrc-embed.su/embed/tv/${currentMedia.id}/${currentMedia.season}/${currentMedia.episode}`;
                else if (serverKey === 'vidembed') url = `https://vidembed.cc/embed.php?tmdb=1&id=${currentMedia.id}&season=${currentMedia.season}&episode=${currentMedia.episode}`;
                else if (serverKey === 'multiembed') url = `https://multiembed.mov/?video_id=${currentMedia.id}&tmdb=1&season=${currentMedia.season}&episode=${currentMedia.episode}`;
            }

            const modal = document.getElementById('playerModal');
            const frame = document.getElementById('videoFrame');
            document.getElementById('playerTitle').textContent = currentMedia.title;

            frame.src = url;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            state.totalPlays++;
            localStorage.setItem('nilo_totalPlays', state.totalPlays);
        }

        function changeServer() {
            loadPlayerUrl();
            showToast('Changing video server...');
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            document.getElementById('videoFrame').src = '';
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function toggleRotation() {
            const wrapper = document.getElementById('videoWrapper');
            state.isRotated = !state.isRotated;
            if (state.isRotated) {
                wrapper.style.transform = 'rotate(90deg)';
                wrapper.style.width = '100vh';
                wrapper.style.height = '100vw';
                wrapper.style.position = 'absolute';
                wrapper.style.top = '50%'; wrapper.style.left = '50%';
                wrapper.style.marginLeft = '-50vh'; wrapper.style.marginTop = '-50vw';
            } else {
                wrapper.style.transform = '';
                wrapper.style.width = ''; wrapper.style.height = '';
                wrapper.style.position = ''; wrapper.style.top = ''; wrapper.style.left = '';
                wrapper.style.marginLeft = ''; wrapper.style.marginTop = '';
            }
        }

        function toggleFullscreen() {
            const modal = document.getElementById('playerModal');
            if (!document.fullscreenElement) {
                modal.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function toggleFavorite(id) {
            const index = state.favorites.findIndex(f => f.id === id);
            const allItems = [...state.movies, ...state.tvShows, ...state.searchResults];
            const item = allItems.find(i => i.id === id);

            if (index === -1) {
                if (item) state.favorites.push(item);
                showToast('Added to favorites ❤️');
            } else {
                state.favorites.splice(index, 1);
                showToast('Removed from favorites 💔');
            }

            localStorage.setItem('nilo_favorites', JSON.stringify(state.favorites));
            renderContent();
        }

        function shareMedia(id, title) {
            const botUsername = tg.initDataUnsafe?.bot?.username || 'nilo_cinema_bot';
            const link = `https://t.me/${botUsername}?start=film_${id}`;
            const text = `🎬 Check out "${title}" on Nilo Cinema!`;
            if (tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`);
            } else {
                window.open(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`, '_blank');
            }
        }

        function showInvite() {
            const modal = document.getElementById('inviteModal');
            const linkInput = document.getElementById('inviteLink');
            const botUsername = tg.initDataUnsafe?.bot?.username || 'nilo_cinema_bot';
            const userId = state.userData?.id || '0';
            linkInput.value = `https://t.me/${botUsername}?start=ref_${userId}`;
            modal.classList.add('active');
        }

        function hideInvite() {
            document.getElementById('inviteModal').classList.remove('active');
        }

        function copyInvite() {
            const input = document.getElementById('inviteLink');
            input.select();
            document.execCommand('copy');
            showToast('Link copied! 📋');
        }

        function shareInvite() {
            const link = document.getElementById('inviteLink').value;
            const text = '🎬 Nilo Cinema - Watch Movies & Series for Free!';
            if (tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initUser();
            loadMovies();
        });
    </script>
</body>
</html>
