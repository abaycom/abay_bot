<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineScope - Stream Movies & TV Shows</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0c11; color: #f4f4f5; padding-bottom: 30px; overflow-x: hidden; }

        /* 👑 PRO NAVIGATION BAR */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; max-width: 1200px; margin: 0 auto;
        }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.4rem; color: #fff; letter-spacing: -0.5px; }
        .logo span { color: #f59e0b; } 
        .logo-icon { width: 26px; height: 26px; background: #f59e0b; border-radius: 6px; display: grid; place-items: center; color: #000; font-weight: bold; font-size: 14px; }
        
        .menu-icon { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .menu-icon div { width: 22px; height: 2.5px; background-color: white; border-radius: 2px; }

        /* 🔍 SEARCH */
        header { display: flex; flex-direction: column; align-items: center; padding: 10px 20px; }
        .search-container { width: 100%; max-width: 500px; margin-bottom: 20px; }
        .search-box { 
            width: 100%; padding: 12px 20px; border-radius: 30px; border: 1px solid #27272a; 
            background-color: #1c1a22; color: white; font-size: 14px; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: #f59e0b; }

        /* 🏷️ GENRE TAGS (ልክ እንደ ፎቶው ከጎን ወደ ጎን የሚሳብ) */
        .genres-container { 
            display: flex; gap: 10px; max-width: 1200px; margin: 0 auto 30px auto; 
            padding: 0 20px; overflow-x: auto; scroll-bar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .genres-container::-webkit-scrollbar { display: none; }
        .genre-btn { 
            background: #1c1a22; color: #a1a1aa; border: 1px solid #27272a; 
            padding: 8px 20px; border-radius: 25px; font-size: 13px; font-weight: 500; 
            cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .genre-btn:hover, .genre-btn.active { background: #2e2a38; border-color: #f59e0b; color: #fff; }

        /* 🎬 MOVIE GRID SECTION */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        .section-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; color: #fff; letter-spacing: -0.5px; }
        
        /* 📱 MOBILE OPTIMIZED GRID: በስልክ 2 ፊልም ብቻ ጎን ለጎን በትልቁ የሚያሳይ */
        .movie-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
        }

        /* 📱 MOBILE CARD DESIGN (ልክ እንደ ፎቶው) */
        .movie-card { background: transparent; cursor: pointer; display: flex; flex-direction: column; }
        .image-wrapper { width: 100%; height: 240px; border-radius: 14px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.03); }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-rating { 
            position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 3px 8px; border-radius: 10px; 
            font-size: 11px; font-weight: 600; color: #f59e0b; display: flex; align-items: center; gap: 3px;
        }

        .movie-info { padding: 10px 2px 0 2px; }
        .movie-title { font-size: 14px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .movie-meta { font-size: 12px; color: #71717a; }

        /* 📺 FULL SCREEN VIDEO PLAYER MODAL */
        .player-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #000000; z-index: 2000; justify-content: center; align-items: center;
        }
        .player-modal.active { display: flex; }
        .modal-content { width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; position: relative; }
        
        /* ማጫወቻው በስልክ ሙሉ ስክሪን እንዲሆን */
        .iframe-container { position: relative; width: 100%; flex-grow: 1; background: #000; display: flex; align-items: center; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }

        /* የclose በተን ማስተካከያ (ቪዲዮው ላይ እንዳይጋርድ ከላይ ተንሳፋፊ የተደረገ) */
        .close-btn { 
            position: absolute; top: 20px; right: 20px; z-index: 2001;
            background: rgba(239, 68, 68, 0.85); backdrop-filter: blur(5px);
            color: white; border: none; padding: 8px 16px; border-radius: 20px; 
            cursor: pointer; font-size: 13px; font-weight: 600; 
        }

        /* ኮምፒውተር ላይ ሲከፈት መልሶ Grid እንዲያስተካክል */
        @media (min-width: 768px) {
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
            .image-wrapper { height: 270px; }
            .modal-content { width: 90%; height: auto; max-width: 900px; border-radius: 16px; border: 1px solid #27272a; overflow: hidden; }
            .iframe-container { padding-top: 56.25%; flex-grow: unset; }
            .close-btn { position: static; margin: 15px; align-self: flex-end; border-radius: 8px; }
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav>
    <div class="logo">
        <div class="logo-icon">🎬</div> Cine<span>Scope</span>
    </div>
    <div class="menu-icon">
        <div></div>
        <div></div>
        <div></div>
    </div>
</nav>

<header>
    <div class="search-container">
        <input type="text" id="searchQuery" class="search-box" placeholder="Search movies..." onkeyup="if(event.key === 'Enter') startSearch()">
    </div>
</header>

<!-- Genre Filters (ልክ እንደ ፎቶው) -->
<div class="genres-container">
    <button class="genre-btn active" onclick="filterGenre('all')">All</button>
    <button class="genre-btn" onclick="filterGenre('28')">Action</button>
    <button class="genre-btn" onclick="filterGenre('12')">Adventure</button>
    <button class="genre-btn" onclick="filterGenre('16')">Animation</button>
    <button class="genre-btn" onclick="filterGenre('35')">Comedy</button>
    <button class="genre-btn" onclick="filterGenre('80')">Crime</button>
    <button class="genre-btn" onclick="filterGenre('27')">Horror</button>
</div>

<main class="main-container">
    <h2 class="section-title" id="listTitle">Now Playing in Theaters</h2>
    <div class="movie-grid" id="movieDisplay"></div>
</main>

<!-- Fullscreen Video Player Modal -->
<div class="player-modal" id="playerModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closePlayer()">✕ Close</button>
        <div class="iframe-container">
            <!-- 🔄 SCREEN ROTATION & FULLSCREEN FULLY ENABLED -->
            <iframe id="videoIframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture; screen-wake-lock"></iframe>
        </div>
    </div>
</div>

<script>
    const API_KEY = "f519e4673f7652685cfc57630b824606";

    window.open = function() { return null; };

    window.onload = function() {
        loadMovies();
    };

    function loadMovies() {
        const url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${API_KEY}&language=en-US&page=1`;
        fetchMovies(url, "Now Playing in Theaters");
    }

    function filterGenre(genreId) {
        document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        if(genreId === 'all') {
            loadMovies();
        } else {
            const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${genreId}&language=en-US`;
            fetchMovies(url, "Filtered Movies");
        }
    }

    function startSearch() {
        const query = document.getElementById('searchQuery').value;
        if(query.trim() !== "") {
            fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=en-US`, `Results for "${query}"`);
        }
    }

    function fetchMovies(url, titleText) {
        document.getElementById('listTitle').innerText = titleText;
        fetch(url)
        .then(res => res.json())
        .then(data => {
            const movies = data.results;
            const display = document.getElementById('movieDisplay');
            display.innerHTML = ""; 

            movies.forEach(movie => {
                if(!movie.poster_path) return; 
                
                const poster = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                const year = movie.release_date ? movie.release_date.substring(0,4) : "N/A";
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : "0.0";

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.id); 
                card.innerHTML = `
                    <div class="image-wrapper">
                        <span class="card-rating">★ ${rating}</span>
                        <img src="${poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">${year} • Movie</div>
                    </div>
                `;
                display.appendChild(card);
            });
        });
    }

    function playMovie(tmdbId) {
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('videoIframe');
        
        modal.classList.add('active');
        iframe.src = `https://vidsrc.pm/embed/movie/${tmdbId}`; 
        
        // 🔄 Auto-request orientation lock or browser full-screen if supported
        if (modal.requestFullscreen) {
            modal.requestFullscreen();
        } else if (modal.webkitRequestFullscreen) {
            modal.webkitRequestFullscreen();
        }
    }

    function closePlayer() {
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('videoIframe');
        iframe.src = ""; 
        modal.classList.remove('active');
        
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    }
</script>
</body>
</html>
